name: Build Sistem Tahanan APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      ACLOCAL_PATH: /usr/share/aclocal

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip \
            autoconf automake autopoint \
            libtool libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            patchelf

      - name: Install Buildozer versi stabil
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36 \
            virtualenv

      - name: Bersihkan build lama
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sistem-tahanan-apk
          path: bin/*.apk