name: Bukulaptah

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container: kivy/buildozer

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Build APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bukulaptah
          path: bin/*.apk